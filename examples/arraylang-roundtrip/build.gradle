// Demonstrates the 0.2.1+ in-place primitive list edit fix. Prefers a local
// publish of this repo (mavenLocal); falls back to Maven Central once 0.2.1
// is released. See README.md in this directory.
plugins {
    id 'java'
    id 'application'
    id 'eu.mihosoft.vmftext' // version: config/common.properties via settings.gradle
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // VMF 0.2.12-SNAPSHOT (list-equals fix, Gradle 10 fixes, plugin marker) until the next VMF release
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots/') }
}

vmfText {
    // vmfVersion: the VMF runtime defaults to the VMF version this plugin generates code with
    antlrVersion = '4.13.2'
}

application {
    mainClass = 'demo.arraylang.Main'
}

tasks.named('run') {
    workingDir = projectDir
}
