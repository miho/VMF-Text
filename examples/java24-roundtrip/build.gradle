// Round-trip showcase: everything resolves from Maven Central — no local
// builds required. See README.md in this directory.
plugins {
    id 'java'
    id 'application'
    id 'eu.mihosoft.vmftext' version '0.2.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

vmfText {
    vmfVersion   = '0.2.10'
    antlrVersion = '4.13.2'
}

application {
    mainClass = 'demo.java24.Main'
}

tasks.named('run') {
    // sample/Shapes.java is addressed relative to the project directory
    workingDir = projectDir
}
