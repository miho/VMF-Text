// Experiment: grammars-v4 C grammar (classic single-file version), unlabeled,
// through VMF-Text with auto-labeling. See README.md for the findings.
plugins {
    id 'java'
    id 'application'
    id 'eu.mihosoft.vmftext' version '0.2.6-SNAPSHOT'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots/') }
}

vmfText {
    antlrVersion = '4.13.2'
    autoLabel    = true      // the point of the experiment: no manual labels
}

application { mainClass = project.findProperty('mainClass') ?: 'ctrial.Main' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
