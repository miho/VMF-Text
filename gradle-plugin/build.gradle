plugins {
    id "com.gradle.plugin-publish" version "2.0.0"
    id 'maven-publish'
    id 'net.nemerosa.versioning' version '3.0.0'
    id 'com.github.ben-manes.versions' version '0.44.0'
}

ext.commonProps = new Properties()
file(new File(projectDir.parentFile,"config/common.properties")).withInputStream { commonProps.load(it) }

wrapper {
    gradleVersion = '9.8.2'
}

repositories {
    mavenCentral()
    mavenLocal()
}

apply plugin: 'groovy'

// Sets project group/version from config/common.properties and configures the
// publications java-gradle-plugin creates ('pluginMaven' + the plugin marker)
// for Maven Central and the Plugin Portal.
apply from: 'gradle/publishing.gradle'

//sourceCompatibility = '11'
//targetCompatibility = '11'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

java {
    toolchain {
        // Gradle 8+ runs on JDK 17+, but we target Java 11 bytecode
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    //    options.compilerArgs << "-Xlint:unchecked" << "-Werror"
    //    options.compilerArgs << "-Xlint:deprecation" << "-Werror"
    options.release = 11
}

// The plugin is authored in Groovy, and GroovyCompile is NOT a JavaCompile, so
// the release=11 above does not apply to it. Without this, the plugin class is
// emitted as Java-21 bytecode (class file 65.0) and fails to load with an
// UnsupportedClassVersionError on any Gradle running on JDK 17 (a supported
// Gradle 9 runtime). Target Java 11 bytecode so the plugin loads everywhere
// Gradle 9 does.
tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '11'
    targetCompatibility = '11'
}


dependencies {
    implementation gradleApi()
    implementation localGroovy()

    // same version as this plugin: both come from config/common.properties
    implementation "eu.mihosoft.vmf:vmf-text:${publishingInfo.versionId}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation gradleTestKit()
}

// Modern plugin declaration for Plugin Portal/publication
gradlePlugin {
    website = 'https://github.com/miho/VMF-Text'
    vcsUrl  = 'https://github.com/miho/VMF-Text'

    plugins {
        vmfTextPlugin {
            id = 'eu.mihosoft.vmftext'
            implementationClass = 'eu.mihosoft.vmf.vmftext.gradle.plugin.VMFTextPlugin'
            displayName = 'Gradle VMF-Text plugin'
            description = 'Gradle VMF-Text plugin'
            tags.set(['vmf-text', 'language modeling framework'])
        }
    }
}

// required on JDK 17 and later for some test environments
tasks.withType(Test).configureEach {
    jvmArgs('--add-opens=java.base/java.lang=ALL-UNNAMED')
}



