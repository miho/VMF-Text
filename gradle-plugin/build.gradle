plugins {
    id "com.gradle.plugin-publish" version "2.0.0"
    id 'com.github.hierynomus.license' version '0.16.1'
    id 'maven-publish'
    id 'net.nemerosa.versioning' version '3.0.0'
    id 'com.github.ben-manes.versions' version '0.44.0'
}

ext.commonProps = new Properties()
file(new File(projectDir.parentFile,"config/common.properties")).withInputStream { commonProps.load(it) }

wrapper {
    gradleVersion = '9.0.0'
}

repositories {
    mavenCentral()
    mavenLocal()
}

apply plugin: 'groovy'

apply from: 'gradle/publishing.gradle'

// Align project coordinates with publishing info (required for pluginMaven publication)
group = publishingInfo.groupId
version = publishingInfo.versionId

//sourceCompatibility = '11'
//targetCompatibility = '11'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

java {
    toolchain {
        // Gradle 8+ runs on JDK 17+, but we target Java 11 bytecode
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    //    options.compilerArgs << "-Xlint:unchecked" << "-Werror"
    //    options.compilerArgs << "-Xlint:deprecation" << "-Werror"
    options.release = 11
}

// The plugin is authored in Groovy, and GroovyCompile is NOT a JavaCompile, so
// the release=11 above does not apply to it. Without this, the plugin class is
// emitted as Java-21 bytecode (class file 65.0) and fails to load with an
// UnsupportedClassVersionError on any Gradle running on JDK 17 (a supported
// Gradle 9 runtime). Target Java 11 bytecode so the plugin loads everywhere
// Gradle 9 does.
tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '11'
    targetCompatibility = '11'
}


dependencies {
    implementation gradleApi()
    implementation localGroovy()

    implementation group: 'eu.mihosoft.vmf', name: 'vmf-text', version: '0.2.1'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation gradleTestKit()
}

// Modern plugin declaration for Plugin Portal/publication
gradlePlugin {
    website = 'https://github.com/miho/VMF-Text'
    vcsUrl  = 'https://github.com/miho/VMF-Text'

    plugins {
        vmfTextPlugin {
            id = 'eu.mihosoft.vmftext'
            implementationClass = 'eu.mihosoft.vmf.vmftext.gradle.plugin.VMFTextPlugin'
            displayName = 'Gradle VMF-Text plugin'
            description = 'Gradle VMF-Text plugin'
            tags.set(['vmf-text', 'language modeling framework'])
        }
    }
}

// java-gradle-plugin registers the 'pluginMaven' publication lazily (after this
// script body finishes evaluating), so named()/getByName() can't see it here yet —
// configureEach() reacts whenever it actually appears instead. Its default
// group/artifactId/version is identical to the hand-configured 'mavenJava'
// publication below (both derive from components.java), which made Gradle warn the
// two publications "will overwrite each other" wherever both get published
// (mavenLocal, and potentially Central). 'mavenJava' remains the real published
// Central artifact (see ROADMAP.md publish commands); this only renames
// pluginMaven's own coordinate so it no longer collides.
publishing.publications.configureEach {
    if (name == 'pluginMaven') {
        artifactId = "${publishingInfo.artifactId}-portal"
    }
}


license {
    // Prefer header from sibling 'core'; fallback to 'test-suite'
    def coreHeader = project.file('../core/config/HEADER')
    def testSuiteHeader = project.file('../test-suite/config/HEADER')
    header = coreHeader.exists() ? coreHeader : testSuiteHeader
    strictCheck = true
    ignoreFailures = true
    mapping {
        java   = 'SLASHSTAR_STYLE'
        groovy = 'SLASHSTAR_STYLE'
        fxml   = 'XML_STYLE'
    }
}

// required on JDK 17 and later for some test environments
tasks.withType(Test).configureEach {
    jvmArgs('--add-opens=java.base/java.lang=ALL-UNNAMED')
}



