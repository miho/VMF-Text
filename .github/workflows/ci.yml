name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The Windows leg is provisional (cross-OS line-ending / path shakedown):
    # keep it non-blocking until it is proven green, so it adds signal without
    # gating the required build.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out VMF-Text
        uses: actions/checkout@v4

      # VMF-Text pins a JDK 21 toolchain and no build auto-downloads
      # toolchains, so it must be installed. (VMF is consumed as a release
      # from Maven Central since 0.2.10 and is no longer built from source.)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make toolchain JDK visible to Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties

      - name: Set up Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and publish vmf-text core to Maven local
        working-directory: core
        run: sh ./gradlew test publishToMavenLocal --no-daemon

      - name: Publish vmf-text Gradle plugin to Maven local
        working-directory: gradle-plugin
        run: sh ./gradlew publishToMavenLocal --no-daemon

      - name: Test Gradle plugin
        working-directory: gradle-plugin
        run: sh ./gradlew test --no-daemon

      - name: Run test suite
        working-directory: test-suite
        run: sh ./gradlew test --no-daemon

      - name: Run ArrayLang round-trip example (local build)
        working-directory: examples/arraylang-roundtrip
        run: sh ./gradlew run --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            test-suite/build/reports/tests/test
            test-suite/build/test-results/test

  # Runs the round-trip showcase against the RELEASED vmf-text from Maven
  # Central (not the local build) — a permanent consumer smoke test of the
  # published artifacts and the README quickstart path.
  roundtrip-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out VMF-Text
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make toolchain JDK visible to Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64" >> ~/.gradle/gradle.properties

      - name: Set up Gradle (caching + wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Run round-trip showcase
        working-directory: examples/java24-roundtrip
        run: sh ./gradlew run --no-daemon
