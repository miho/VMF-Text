// -----------------------------------------------------------------------------
// Collect publishing information
// -----------------------------------------------------------------------------
ext.publishingInfo = [:]

ext.publishingInfo.pomName =  ext.publishingInfo.artifactId

apply from: "gradle/project-info.gradle"
apply plugin: 'signing'

// Project coordinates come from config/common.properties (via project-info).
// They are set here, *before* the jar manifest and the publications below are
// configured, so every artifact and manifest carries the real version (the
// 0.2.1 jars shipped with "Implementation-Version: unspecified" because the
// build script only set them after this file had been applied).
group   = publishingInfo.groupId
version = publishingInfo.versionId

// -----------------------------------------------------------------------------
// Performs publishing
// -----------------------------------------------------------------------------

Date buildTimeAndDate = new Date()
ext {
    buildDate = new java.text.SimpleDateFormat('yyyy-MM-dd').format(buildTimeAndDate)
    buildTime = new java.text.SimpleDateFormat('HH:mm:ss.SSSZ').format(buildTimeAndDate)
}

jar {
    manifest {
        attributes(
                'Built-By': System.properties['user.name'],
                'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.properties['java.vm.version'] + ")",
                'Build-Date': project.buildDate,
                'Build-Time': project.buildTime,
                'Build-Revision': versioning.info.commit,
                'Specification-Title': project.name,
                'Specification-Version': project.version,
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

// Sources and javadoc jars are part of components.java; Maven Central and the
// Gradle Plugin Portal both require them.
java {
    withJavadocJar()
    withSourcesJar()
}

// Maven Central rejects POMs without url/license/developer/scm metadata. This is
// applied to *every* publication that leaves this build (library jar, plugin jar
// and plugin marker alike).
def centralPomMetadata = { org.gradle.api.publish.maven.MavenPom pom ->
    pom.url = publishingInfo.websiteUrl
    pom.inceptionYear = publishingInfo.inceptionYear
    pom.licenses {
        license {
            name = publishingInfo.license
            url = publishingInfo.licenseUrl
            distribution = 'repo'
        }
    }
    pom.developers {
        developer {
            id = publishingInfo.developerAlias
            name = publishingInfo.developerName
            email = publishingInfo.developerEmail
        }
    }
    pom.scm {
        url = publishingInfo.vcsUrl
        connection = publishingInfo.vcsUrl
        developerConnection = publishingInfo.vcsUrl
    }
}

def isGradlePluginBuild = project.plugins.hasPlugin('java-gradle-plugin')

publishing {
    publications {
        // Library builds (core): one hand-configured publication, 'mavenJava'.
        // -> publishMavenJavaPublicationTo<Repository>Repository
        if (!isGradlePluginBuild) {
            mavenJava(MavenPublication) {
                groupId = publishingInfo.groupId
                artifactId = publishingInfo.artifactId
                version = publishingInfo.versionId

                // main JAR + sources JAR + javadoc JAR
                from components.java

                pom {
                    name = publishingInfo.pomName
                    description = publishingInfo.desc
                }
                centralPomMetadata(pom)
            }
        }
    }

    repositories {
        // --------------------------------------------------------------------------------
        // Destination Repository 'GitHubPackages'
        // -> call task 'publishAllPublicationsToGitHubPackagesRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "GitHubPackages"
            // see https://levelup.gitconnected.com/publish-a-maven-package-to-github-with-gradle-fabc6de24d6
            // Replace OWNER and REPOSITORY with your GitHub username/repository
            // (must be both lowercase according to the documenations)
            // url = uri("https://maven.pkg.github.com/OWNER/REPOSITORY")
            url = uri(project.findProperty('publishingInfo').gitHubMavenRepo)
            credentials {
                // Make sure to generate a token with write-packages and read-packages permission:
                // https://github.com/settings/tokens/new
                // You can either store the username and token in
                //   ~/.gradle/gradle.properties (use the gpr.user and gpr.key keys)
                // Or you can store them as environment variables e.g. in ~/.bash_profile or ~/.zsh
                // depending on your shell (GITHUB_USERNAME and GITHUB_TOKEN keys)
                // Or you pass them via CLI: gradle publish -Pgpr.user=username -Pgpr.key=token
                // See at EOF for examples on how to store the credentials
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'MavenCentral' (Central Portal, OSSRH-compatible
        // staging API)
        // -> call task 'publishAllPublicationsToMavenCentralRepository', then
        //    'releaseToCentralPortal' (below) to hand the staging repo off to the Portal
        // --------------------------------------------------------------------------------
        maven {
            name = "MavenCentral"

            def releasesRepoUrl  = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"

            url = uri(publishingInfo.versionId.endsWith('-SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl)

            credentials {
                username = project.findProperty("mavenCentralUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                password = project.findProperty("mavenCentralPassword") ?: System.getenv("CENTRAL_PORTAL_PWD")
            }
        }

        // --------------------------------------------------------------------------------
        // Destination Repository 'BuildDir'
        // telling gradle to publish artifact to local directory (build/artifacts) --
        // useful to inspect exactly what a (signed) publish would upload
        // -> call task 'publishAllPublicationsToBuildDirRepository' to publish
        // --------------------------------------------------------------------------------
        maven {
            name = "BuildDir"
            url = uri(layout.buildDirectory.dir('artifacts').get().asFile)
        }
    }
}

// Gradle-plugin builds (gradle-plugin): java-gradle-plugin creates the
// publications itself, lazily, after this script body has run:
//   - 'pluginMaven'                    the plugin jar (from components.java)
//   - '<pluginName>PluginMarkerMaven'  one marker POM per declared plugin id
//                                      (eu.mihosoft.vmftext:eu.mihosoft.vmftext.gradle.plugin)
// Both go to Maven Central *and* to the Plugin Portal, so they get the
// publishingInfo coordinates and the Central POM metadata here. The marker POM
// declares a dependency on pluginMaven's coordinates, which is why pluginMaven
// must keep the standard artifactId: 0.2.1 renamed it to '<artifactId>-portal' to
// dodge a collision with a separate 'mavenJava' publication, and as a result the
// marker pointed at an artifact that only existed on the Portal, never on
// Central (no Central marker was published at all). Central-only resolution of
// `plugins { id "eu.mihosoft.vmftext" }` therefore only worked for 0.2.0.
if (isGradlePluginBuild) {
    publishing.publications.configureEach { pub ->
        if (pub.name == 'pluginMaven') {
            pub.groupId = publishingInfo.groupId
            pub.artifactId = publishingInfo.artifactId
            pub.version = publishingInfo.versionId
            pub.pom { org.gradle.api.publish.maven.MavenPom p ->
                p.name = publishingInfo.pomName
                p.description = publishingInfo.desc
            }
            centralPomMetadata(pub.pom)
        } else if (pub.name.endsWith('PluginMarkerMaven')) {
            // name/description come from the gradlePlugin { } declaration
            centralPomMetadata(pub.pom)
        }
    }
}

if(
        project.findProperty("signing.secretKeyRingFile")
                && project.findProperty("signing.password")
                && project.findProperty("signing.keyId")
) {

    signing {
        // signs every publication, including the ones java-gradle-plugin adds later
        sign publishing.publications
    }

} else {
    println "> skipping signing, provide\n" +
            "  - 'signing.secretKeyRingFile'\n" +
            "  - 'signing.password'\n" +
            "  - 'signing.keyId'\n" +
            " to activate it\n"
}

import org.gradle.plugins.signing.Sign

def isMavenLocalBuild = gradle.startParameter.taskNames.any {
    it.equalsIgnoreCase('publishToMavenLocal') || it.endsWith('ToMavenLocal')
}

tasks.withType(Sign).configureEach {
    // This prevents sign* tasks (including signPluginMavenPublication) from running at all
    onlyIf { !isMavenLocalBuild }
}

tasks.register('releaseToCentralPortal') {
    group = 'publishing'
    description = 'Hands off the last non-SNAPSHOT upload to the Central Portal so it appears under Deployments.'

    doLast {
        if (publishingInfo.versionId.endsWith('-SNAPSHOT')) {
            println "Version '${publishingInfo.versionId}' is a SNAPSHOT. Skipping Portal hand-off."
            return
        }

        if (!project.hasProperty('sonatypeNamespace')) {
            throw new InvalidUserDataException("Provide -PsonatypeNamespace=your.namespace")
        }
        if (!project.hasProperty('mavenCentralUsername') || !project.hasProperty('mavenCentralPassword')) {
            throw new InvalidUserDataException("Missing Central Portal token username/password.")
        }

        def sonatypeNamespace = project.property('sonatypeNamespace')
        def username = project.property('mavenCentralUsername')
        def token    = project.property('mavenCentralPassword')
        def publishingType = (project.findProperty('publishingType') ?: 'user_managed') as String

        // Optional fallback: pass -PrepositoryKey=<key> to hand off a specific repo
        def repositoryKey = project.findProperty('repositoryKey') as String

        String apiUrl = repositoryKey ?
                "https://ossrh-staging-api.central.sonatype.com/manual/upload/repository/${repositoryKey}?publishing_type=${publishingType}" :
                "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${sonatypeNamespace}?publishing_type=${publishingType}"

        println "--> Handing off ${repositoryKey ? "repositoryKey=${repositoryKey}" : "namespace=${sonatypeNamespace}"} to Central (publishing_type=${publishingType})..."

        HttpURLConnection connection = (HttpURLConnection) new URL(apiUrl).openConnection()
        try {
            def bearer = "${username}:${token}".bytes.encodeBase64().toString()
            connection.setRequestProperty('Authorization', "Bearer ${bearer}") // Bearer + base64(user:pass)
            connection.requestMethod = 'POST'
            connection.connectTimeout = 60_000
            connection.readTimeout    = 300_000

            def code = connection.responseCode
            def body = (code >= 400 ? connection.errorStream : connection.inputStream)?.getText('UTF-8')
            println "HTTP ${code} ${connection.responseMessage}"
            if (body) println "Response:\n${body}"
            if (code >= 400) throw new GradleException("Portal hand-off failed with HTTP ${code}")
        } finally {
            connection.disconnect()
        }

        println "\nSuccess. Check https://central.sonatype.com/publishing/deployments"
    }
}
