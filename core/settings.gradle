pluginManagement {

  resolutionStrategy {
      eachPlugin {
          // Resolve the plugin module directly, including for local development.
          if ('eu.mihosoft.vmf'.equals(requested.id.toString())) {
              useModule('eu.mihosoft.vmf:vmf-gradle-plugin:'+requested.version)
          }
      }
  }

  repositories {
      mavenLocal()
      gradlePluginPortal()
      mavenCentral()
  }
}

rootProject.name = 'VMF-Text'
