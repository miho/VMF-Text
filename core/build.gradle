import org.antlr.v4.tool.ErrorType

buildscript {

    ext.commonProps = new Properties()
    file(new File(projectDir.parentFile,"config/common.properties")).withInputStream { commonProps.load(it) }


    repositories {
//        jcenter()
        mavenCentral()
        // VMF 0.2.12-SNAPSHOT (list-equals fix, Gradle 10 fixes, plugin marker) until the next VMF release
        maven { url = uri('https://central.sonatype.com/repository/maven-snapshots/') }
        mavenLocal()
    }

    dependencies {
        classpath 'org.antlr:antlr4:4.13.2'
        // the VMF plugin is applied below, after the repositories block: it resolves
        // its 'vmfCompile' configuration (vmf, vmf-runtime) while being applied, with
        // the repositories that exist at that moment — a `plugins {}` application
        // would see only the plugin's own mavenLocal()/mavenCentral(), not the Central
        // snapshot repository the 0.2.12-SNAPSHOT needs
        classpath 'eu.mihosoft.vmf:vmf-gradle-plugin:0.2.12-SNAPSHOT'
//        classpath group: 'eu.mihosoft.vmf', name: 'vmf', version: '0.1-SNAPSHOT'
    }
}


plugins {
    id 'maven-publish'
    id 'net.nemerosa.versioning' version '2.4.0'
    id 'com.github.ben-manes.versions' version '0.13.0'
}

apply plugin: 'java'
apply plugin: 'idea'

ext.commonProps = new Properties()
file(new File(projectDir.parentFile,"config/common.properties")).withInputStream { commonProps.load(it) }

// also sets project group/version from config/common.properties
apply from: 'gradle/publishing.gradle'

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
//    options.compilerArgs << "-Xlint:unchecked" << "-Werror"
//    options.compilerArgs << "-Xlint:deprecation" << "-Werror"
    options.release = 11
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}

test {
    useJUnit()
}

repositories {
    mavenCentral()
    // VMF 0.2.12-SNAPSHOT (list-equals fix, Gradle 10 fixes, plugin marker) until the next VMF release
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots/') }
//    jcenter()
    mavenLocal()
}

// applied here, after the repositories above exist (see the buildscript block)
apply plugin: 'eu.mihosoft.vmf'

wrapper {
    gradleVersion = '9.8.2'
}


// (removed unused ext.mainClass default: 'core' applies no 'application' plugin,
// and the referenced package eu.mihosoft.antlrmodeling01 does not exist)


