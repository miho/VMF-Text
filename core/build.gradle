    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'

    testImplementation 'junit:junit:4.13.2'
}

class AntlrTool extends org.antlr.v4.Tool {
    public AntlrTool(String[] args) {
        super(args);
    }
    public void exit(int e) {}
    public static void main(String[] args) {
        AntlrTool antlr = new AntlrTool(args);
        if ( args.length == 0 ) { antlr.help(); antlr.exit(0); }

        try {
            antlr.processGrammarsOnCommandLine();
        }
        finally {
            if ( antlr.log ) {
                try {
                    String logname = antlr.logMgr.save();
                    System.out.println("wrote "+logname);
                }
                catch (IOException ioe) {
                    antlr.errMgr.toolError(ErrorType.INTERNAL_ERROR, ioe);
                }
            }
        }
        if ( antlr.return_dont_exit ) return;

        if (antlr.errMgr.getNumErrors() > 0) {
            antlr.exit(1);
        }
        antlr.exit(0);
    }
}

// ANTLR tool runs for the bundled grammars. Paths are resolved once, at
// configuration time, so the doLast blocks never touch Task.project (deprecated
// at execution time, removed in Gradle 10).
def antlrSrcPath = file('src/main/resources/eu/mihosoft/vmf/vmftext/antlr').absolutePath
def antlrGenDir  = layout.buildDirectory.dir('antlr4-src-gen').get().asFile

task cleanAntlr {
    doLast {
        antlrGenDir.deleteDir()
    }
}

clean.dependsOn('cleanAntlr')

task antlr4 {
    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/antlr4"
        def grammarFile = srcPath + "/ANTLRv4Parser.g4"
        def grammarFileDep1 = srcPath + "/ANTLRv4Lexer.g4"
        def grammarFileDep2 = srcPath + "/LexBasic.g4"

        AntlrTool.main(
                [grammarFile,
                 grammarFileDep1,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.antlr4",
                 "-lib",
                 srcPath,
                 "-o", outPath] as String[])
    }

    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/java9"
        def grammarFile = srcPath + "/Java9.g4"

        AntlrTool.main(
                [grammarFile,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.java9",
                 "-lib",
                 libPath,
                 "-o", outPath] as String[])
    }

    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/typemapping"
        def grammarFile = srcPath + "/TypeMapping.g4"

        AntlrTool.main(
                [grammarFile,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.typemapping",
                 "-lib",
                 libPath,
                 "-o", outPath] as String[])
    }

    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/vmftextcomments"
        def grammarFile = srcPath + "/VMFTextComments.g4"

        AntlrTool.main(
                [grammarFile,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.vmftextcomments",
                 "-lib",
                 libPath,
                 "-o", outPath] as String[])
    }

    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/custommodeldef"
        def grammarFile = srcPath + "/CustomModelDefinitions.g4"
        def grammarFile2 = srcPath + "/Java9.g4"

        AntlrTool.main(
                [grammarFile, grammarFile2,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.custommodeldef",
                 "-lib",
                 libPath,
                 "-o", outPath] as String[])
    }
}

task antlr4test() {
    doLast() {
        def srcPath = antlrSrcPath
        def libPath = srcPath
        def outPath = "${antlrGenDir}/eu/mihosoft/vmf/vmftext/grammar/antlr4test"
        def grammarFile = srcPath + "/GrammarVMF2.g4"

        AntlrTool.main(
                [grammarFile,
                 "-listener", "-visitor",
                 "-package", "eu.mihosoft.vmf.vmftext.grammar.antlr4test",
                 "-lib",
                 srcPath,
                 "-o", outPath] as String[])
    }
}

// before we compile we need to run the antlr4 code generator
project.tasks.withType(JavaCompile) {
    compileTask -> compileTask.dependsOn('antlr4')
}

// Ensure sources JAR includes generated VMF sources
tasks.named('sourcesJar') {
    dependsOn('vmfGenModelSources')
}


jar {
    manifest {
        attributes('Automatic-Module-Name': 'eu.mihosoft.vmf.vmftext')
    }
}


ext.vmfPluginIntelliJIntegration = true
idea.module {
        dependencies {
            implementation 'eu.mihosoft.vmf:vmf:0.2.12-SNAPSHOT'
        }
}

