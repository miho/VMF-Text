dependencies {
   
    implementation 'org.antlr:antlr4:4.13.2'

    implementation 'eu.mihosoft.ext.velocity.legacy:velocity-legacy:1.7.4'

    implementation 'eu.mihosoft.vmf:vmf:0.2.12-SNAPSHOT'
    implementation 'eu.mihosoft.vmf:vmf-runtime:0.2.12-SNAPSHOT'

    implementation 'org.mdkt.compiler:InMemoryJavaCompiler:1.3.0'
    implementation 'org.apache.groovy:groovy:4.0.21'

