buildscript {
    // the plugin under test: the version published to mavenLocal by this
    // repository's build chain (config/common.properties)
    ext.commonProps = new Properties()
    file(new File(projectDir.parentFile, "config/common.properties")).withInputStream { commonProps.load(it) }

    repositories {
        mavenLocal()
    }

    dependencies {
        classpath "eu.mihosoft.vmf:vmf-text-gradle-plugin:${commonProps.get('publication.version')}"
        //classpath fileTree(dir: '../gradle-plugin/build/libs/', include: '*.jar')
    }
}

plugins {
    // id 'eu.mihosoft.vmftext' version '0.1.2'
    id 'net.nemerosa.versioning' version '2.4.0'
    id 'com.github.ben-manes.versions' version '0.13.0'
}

wrapper {
    gradleVersion = '9.8.2'

    // def jvmOpts = "-Xmx2048m -XX:+CMSClassUnloadingEnabled"
    // inputs.property("jvmOpts", jvmOpts)
    // doLast {
    //     def optsEnvVar = "DEFAULT_JVM_OPTS"
    //     scriptFile.write scriptFile.text.replace("$optsEnvVar=\"\"", "$optsEnvVar=\"$jvmOpts\"")
    //     batchScript.write batchScript.text.replace("set $optsEnvVar=", "set $optsEnvVar=$jvmOpts")
    // }
}

apply plugin: 'java'
apply plugin: 'eu.mihosoft.vmftext'

//sourceCompatibility = '11'
//targetCompatibility = '11'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    //    options.compilerArgs << "-Xlint:unchecked" << "-Werror"
    //    options.compilerArgs << "-Xlint:deprecation" << "-Werror"
    options.release = 11
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
[compileJava, compileTestJava]*.options*.fork = true
[compileJava, compileTestJava]*.options*.forkOptions*.memoryMaximumSize = '4g'

if (!hasProperty('mainClass')) {
    ext.mainClass = 'eu.mihosoft.vmftext.tutorial.Main'
}

repositories {
    mavenCentral()
//    jcenter()
    mavenLocal()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mdkt.compiler:InMemoryJavaCompiler:1.3.0'
    testImplementation 'org.apache.groovy:groovy:4.0.21'

    testImplementation 'eu.mihosoft.vtcc:vtcc:2018.2.3'
    testImplementation 'eu.mihosoft.vtcc.tccdist:tcc-dist:2018.2.3'

    implementation 'commons-jxpath:commons-jxpath:1.3'
}

// vmfText {
//     version    = "0.1.1"
//     vmfVersion = "0.1"
// }

test {
    forkEvery = 1; workingDir = { projectDir }

    // set heap size for the test JVM(s)
    //minHeapSize = "512m"
    //maxHeapSize = "2048m"

    // set JVM arguments for the test JVM(s)
    //jvmArgs '-XX:MaxPermSize=256m'
}

